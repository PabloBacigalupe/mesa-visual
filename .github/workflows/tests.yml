name: Comprobar Mesa Visual

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Probar el servidor sin llamadas a OpenAI
        run: python -m unittest discover -p test_server.py -v
      - name: Probar la interfaz
        run: node --test test_frontend.cjs
      - name: Comprobar JavaScript
        run: node --check dist/app.js
